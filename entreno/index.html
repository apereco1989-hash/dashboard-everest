<title>Serie a Serie</title>
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serie a Serie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column phone app, gym-signage condensed headings, iron & chalk neutrals, 20 kg plate blue accent; bottom tab bar */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#e3e6ea; --line:#cfd4da;
  --fg:#15191e; --muted:#5d6670; --accent:#1f5fd1; --accent-ink:#ffffff;
  --done:#1d8a4e; --warn:#c2410c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181c22; --sunk:#0b0d10; --line:#2a3039;
  --fg:#e9ecef; --muted:#8e98a3; --accent:#5b93ff; --accent-ink:#0b1220;
  --done:#3fbf78; --warn:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181c22; --sunk:#0b0d10; --line:#2a3039;
  --fg:#e9ecef; --muted:#8e98a3; --accent:#5b93ff; --accent-ink:#0b1220;
  --done:#3fbf78; --warn:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--tabh) + 120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.1rem;font-weight:800;text-transform:uppercase;line-height:1}
h2{font-size:1.35rem;font-weight:700;text-transform:uppercase}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--sunk);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--warn)}
.btn.wide{width:100%}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
header.top{display:flex;flex-direction:column;gap:6px;padding-block:8px 4px}

/* Routines */
.routines{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.routines{grid-template-columns:1fr}}
.routine{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.routine:active{transform:scale(.98)}
.routine h3{font-size:1.4rem;font-weight:800;text-transform:uppercase}
.routine ul{margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}
.routine .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:.9rem}
.plate{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Session */
.sesshead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.clock{font:700 1.6rem/1 var(--mono)}
.restpick{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:3px}
.restpick button{padding:6px 10px;border-radius:8px;font:500 .85rem var(--mono);color:var(--muted)}
.restpick button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex h3{font-size:1.3rem;font-weight:700}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) 72px 64px 48px;gap:6px 8px;align-items:center}
.sets .hd{font:600 .7rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sets .prev{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:700 1rem var(--mono);text-align:center;padding:0 4px}
.sets .idx{font:700 .95rem var(--mono);color:var(--muted);text-align:center}
.chk{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.chk svg{width:20px;height:20px;stroke:var(--muted)}
.chk.on{background:var(--done);border-color:var(--done)}
.chk.on svg{stroke:#fff}
.setrow-done input{border-color:var(--done)}
.addex{display:flex;gap:8px}
.addex input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:16px var(--body);padding:0 12px}
.confirm{background:var(--surface);border:1px solid var(--warn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:20;padding:0 12px 10px}
.rest .card{max-width:536px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgb(0 0 0 / .25)}
.rest .t{font:700 2rem/1 var(--mono);min-width:5ch}
.rest .lbl{font:600 .7rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.rest .card .btn{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);min-height:40px;padding:0 10px}
.rest .bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;margin-top:6px}
.rest .bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.rest .card.over{background:var(--done);color:#fff}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font:700 1.5rem/1.1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:.78rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.prs{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 14px;font-size:.92rem}
.prs .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;flex-direction:column;gap:10px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sess h3{font-size:1.15rem;font-weight:700;text-transform:uppercase}
.sess .meta{font:500 .8rem var(--mono);color:var(--muted)}
.sess .lines{font-size:.88rem;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:560px;height:var(--tabh)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="app"></main>
<div class="rest" id="rest" hidden></div>
<nav class="tabs" aria-label="Secciones"><div class="in" role="tablist">
  <button role="tab" id="tab-train" aria-selected="true" data-tab="train">
    <svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Entrenar</button>
  <button role="tab" id="tab-prog" aria-selected="false" data-tab="prog">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
</div></nav>

<script>
(() => {
const PRESETS = [
  {name:"Empuje", plate:"#d63a3a", ex:[["Press banca",4,8],["Press militar",3,10],["Fondos",3,10],["Extensión de tríceps",3,12]]},
  {name:"Tirón", plate:"#1f5fd1", ex:[["Dominadas",4,8],["Remo con barra",4,8],["Face pull",3,15],["Curl de bíceps",3,12]]},
  {name:"Pierna", plate:"#e0b40f", ex:[["Sentadilla",4,6],["Peso muerto rumano",3,8],["Zancadas",3,10],["Elevación de talones",4,15]]},
  {name:"Cuerpo completo", plate:"#2f9e57", ex:[["Sentadilla",3,8],["Press banca",3,8],["Remo con barra",3,8],["Plancha (seg)",3,45]]},
];
const LS_DRAFT="sas.draft", LS_LOCAL="sas.sessions", LS_REST="sas.rest";
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem(k)}catch{}}
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtKg = n => n>=10000 ? (n/1000).toFixed(1).replace(".",",")+" t" : Math.round(n).toLocaleString("es")+" kg";
const pad = n => String(n).padStart(2,"0");
const mmss = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };

let state = {
  tab:"train",
  draft: ls.get(LS_DRAFT,null),
  sessions: [],
  storeMode:"loading", // loading | cloud | local
  rest: ls.get(LS_REST,90),
  confirm:null, // "finish" | "discard" | {del:id}
};
let col = null;
let restT = null; // {end, total}

/* ---------- storage ---------- */
function initStore(){ state.storeMode="local"; state.sessions = ls.get(LS_LOCAL,[]); render(); }
async function saveSession(s){ const all=ls.get(LS_LOCAL,[]); all.unshift(s); all.sort((x,y)=>y.date<x.date?-1:1); ls.set(LS_LOCAL,all); state.sessions=all; }
async function deleteSession(id){ const all=ls.get(LS_LOCAL,[]).filter(s=>s.id!==id); ls.set(LS_LOCAL,all); state.sessions=all; }
function exportBackup(){
  const data=JSON.stringify({app:"serie-a-serie",v:1,exported:new Date().toISOString(),sessions:state.sessions},null,1);
  const name="serie-a-serie-"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([data],name,{type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:"Copia Serie a Serie"}).catch(()=>{}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result); const inc=Array.isArray(j)?j:j.sessions; if(!Array.isArray(inc)) throw 0;
    const byId=new Map(ls.get(LS_LOCAL,[]).map(s=>[s.id,s])); inc.forEach(s=>s&&s.id&&byId.set(s.id,s));
    const all=[...byId.values()].sort((x,y)=>y.date<x.date?-1:1); ls.set(LS_LOCAL,all); state.sessions=all;
    state.msg=`Copia importada: ${inc.length} sesiones.`;
  }catch{ state.msg="Ese archivo no es una copia de Serie a Serie."; } render(); };
  r.readAsText(file);
}

/* ---------- helpers ---------- */
function lastSets(name){
  for(const s of state.sessions){ const e=(s.exercises||[]).find(x=>x.name===name); if(e) return e.sets.filter(x=>x.done); }
  return [];
}
const volumeOf = s => (s.exercises||[]).reduce((a,e)=>a+e.sets.filter(x=>x.done).reduce((b,x)=>b+num(x.kg)*num(x.reps),0),0);
const e1rm = (kg,reps) => reps<=1 ? kg : kg*(1+reps/30);
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function saveDraft(){ state.draft ? ls.set(LS_DRAFT,state.draft) : ls.del(LS_DRAFT); }

/* ---------- audio / haptics ---------- */
let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22,0.44].forEach((t,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value = i===2?1320:880; o.connect(g); g.connect(actx.destination);
      const at=actx.currentTime+t; g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(0.3,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+0.18);
      o.start(at); o.stop(at+0.2); });
  }catch{}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch{}
}
let wake=null;
async function keepAwake(){ try{ if(!wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); wake?.addEventListener?.("release",()=>wake=null);}catch{} }

/* ---------- actions ---------- */
function startRoutine(i){
  const p = PRESETS[i];
  state.draft = { id:"s"+Date.now(), routine:p.name, started:Date.now(),
    exercises: p.ex.map(([name,sets,reps])=>{
      const prev = lastSets(name);
      return {name, sets:Array.from({length:sets},(_,k)=>({kg: prev[k]?.kg ?? prev[prev.length-1]?.kg ?? "", reps: prev[k]?.reps ?? reps, done:false}))};
    })};
  saveDraft(); keepAwake(); try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch{}
  render(); scrollTo(0,0);
}
function startEmpty(){
  state.draft = { id:"s"+Date.now(), routine:"Libre", started:Date.now(), exercises:[] };
  saveDraft(); keepAwake(); render(); scrollTo(0,0);
}
function startRest(){
  restT = {end: Date.now()+state.rest*1000, total:state.rest, beeped:false};
  renderRest();
}
async function finish(){
  const d = state.draft;
  d.exercises = d.exercises.map(e=>({...e, sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  const s = { id:d.id, routine:d.routine, date:new Date(d.started).toISOString(),
    minutes: Math.max(1,Math.round((Date.now()-d.started)/60000)), exercises:d.exercises };
  s.volume = Math.round(volumeOf(s));
  state.draft=null; state.confirm=null; restT=null; saveDraft();
  if(s.exercises.length) await saveSession(s);
  state.tab="prog"; render(); renderRest(); scrollTo(0,0);
}

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  const focusId = document.activeElement?.id;
  app.innerHTML = state.tab==="train" ? (state.draft ? viewSession() : viewPick()) : viewProgress();
  if(focusId){ const el=document.getElementById(focusId); if(el && el.tagName==="INPUT") el.focus(); }
}

function viewPick(){
  const today = new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
  const last = state.sessions[0];
  return `<div class="stack">
    <header class="top"><span class="eyebrow">${esc(today)}</span><h1>¿Qué toca hoy?</h1>
      ${last?`<span class="muted">Último: ${esc(last.routine)} · ${new Date(last.date).toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}</span>`:`<span class="muted">Elige una rutina. Los pesos se rellenan con tu última sesión.</span>`}
    </header>
    <div class="routines">${PRESETS.map((p,i)=>`
      <button class="routine" data-act="start" data-i="${i}">
        <h3><span class="plate" style="background:${p.plate}"></span>${esc(p.name)}</h3>
        <ul>${p.ex.map(([n,s,r])=>`<li>${esc(n)} <span class="num">${s}×${r}</span></li>`).join("")}</ul>
        <span class="go">Empezar →</span>
      </button>`).join("")}
    </div>
    <button class="btn ghost wide" data-act="empty">Entrenamiento libre</button>
  </div>`;
}

const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
function viewSession(){
  const d = state.draft;
  const done = d.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const total = d.exercises.reduce((a,e)=>a+e.sets.length,0);
  return `<div class="stack">
    <div class="sesshead"><div class="spread">
      <div><span class="eyebrow">${esc(d.routine)} · <span class="num">${done}/${total}</span> series</span>
        <div class="clock num" id="clock">${mmss((Date.now()-d.started)/1000)}</div></div>
      <div class="restpick" role="group" aria-label="Descanso">${[60,90,120,180].map(s=>`<button data-act="restpick" data-s="${s}" aria-pressed="${state.rest===s}">${s<120?s+"s":(s/60)+"m"}</button>`).join("")}</div>
    </div></div>
    ${d.exercises.map((e,ei)=>{
      const prev = lastSets(e.name);
      return `<section class="ex">
        <div class="spread"><h3>${esc(e.name)}</h3><button class="btn danger" style="min-height:32px;padding:0 6px;font-size:.8rem" data-act="rmex" data-e="${ei}" aria-label="Quitar ${esc(e.name)}">Quitar</button></div>
        <div class="sets">
          <span class="hd">#</span><span class="hd">Anterior</span><span class="hd" style="text-align:center">kg</span><span class="hd" style="text-align:center">Reps</span><span></span>
          ${e.sets.map((s,si)=>`
            <span class="idx">${si+1}</span>
            <span class="prev">${prev[si]?`${esc(prev[si].kg||0)}×${esc(prev[si].reps)}`:"—"}</span>
            <input id="kg-${ei}-${si}" inputmode="decimal" aria-label="kg serie ${si+1}" value="${esc(s.kg)}" data-f="kg" data-e="${ei}" data-s="${si}" class="${s.done?"setrow-done":""}" placeholder="0">
            <input id="rp-${ei}-${si}" inputmode="numeric" aria-label="repeticiones serie ${si+1}" value="${esc(s.reps)}" data-f="reps" data-e="${ei}" data-s="${si}" placeholder="0">
            <button class="chk ${s.done?"on":""}" data-act="tick" data-e="${ei}" data-s="${si}" aria-label="Serie ${si+1} hecha" aria-pressed="${s.done}">${CHECK}</button>`).join("")}
        </div>
        <div class="row"><button class="btn" data-act="addset" data-e="${ei}">+ Serie</button>
          ${e.sets.length>1?`<button class="btn ghost" data-act="rmset" data-e="${ei}">− Serie</button>`:""}</div>
      </section>`}).join("")}
    <form class="addex" id="addex"><input id="newex" placeholder="Añadir ejercicio (p. ej. Hip thrust)" autocomplete="off" list="exlist"><button class="btn" type="submit">Añadir</button></form>
    <datalist id="exlist">${[...new Set([...PRESETS.flatMap(p=>p.ex.map(x=>x[0])),...state.sessions.flatMap(s=>(s.exercises||[]).map(e=>e.name))])].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    ${state.confirm==="finish"?`<div class="confirm"><strong>¿Terminar y guardar?</strong><span class="note">Se guardan solo las series marcadas como hechas (${done}).</span>
        <div class="row"><button class="btn primary" data-act="finish-yes">Guardar entrenamiento</button><button class="btn" data-act="cancel">Seguir entrenando</button></div></div>`
     :state.confirm==="discard"?`<div class="confirm"><strong>¿Descartar este entrenamiento?</strong><span class="note">No se guardará nada.</span>
        <div class="row"><button class="btn danger ghost" data-act="discard-yes">Descartar</button><button class="btn" data-act="cancel">Volver</button></div></div>`
     :`<div class="row"><button class="btn primary" style="flex:1" data-act="finish">Terminar</button><button class="btn ghost danger" data-act="discard">Descartar</button></div>`}
  </div>`;
}

function viewProgress(){
  const S = state.sessions;
  const note = `<section class="panel stack" style="gap:10px"><h2>Copia de seguridad</h2>
    <p class="note" style="margin:0">Tus entrenamientos se guardan solo en este teléfono. Exporta una copia de vez en cuando (guárdala en Drive, iCloud o envíatela) para no perderlos si cambias de celular.</p>
    ${state.msg?`<p style="margin:0"><strong>${esc(state.msg)}</strong></p>`:""}
    <div class="row"><button class="btn" data-act="export">Exportar copia</button>
    <label class="btn ghost" for="importfile">Importar copia</label><input type="file" id="importfile" accept="application/json,.json" hidden></div></section>`;
  if(false) return `<div class="stack"><header class="top"><span class="eyebrow">Progreso</span><h1>Tu historial</h1></header><div class="empty">Cargando tus entrenamientos…</div></div>`;
  if(!S.length) return `<div class="stack"><header class="top"><span class="eyebrow">Progreso</span><h1>Tu historial</h1></header>
    <div class="empty"><p><strong>Aún no hay entrenamientos.</strong></p><p>Cuando termines tu primera sesión verás aquí tu volumen semanal, tus récords y el historial.</p>
    <button class="btn primary" data-act="gotrain">Empezar a entrenar</button></div>${note}</div>`;
  const now = new Date(), ws = weekStart(now).getTime();
  const thisWeek = S.filter(s=>new Date(s.date)>=ws);
  // streak in weeks with ≥1 session
  let streak=0; { let w=weekStart(now); const set=new Set(S.map(s=>weekStart(s.date).getTime()));
    if(!set.has(w.getTime())) w.setDate(w.getDate()-7);
    while(set.has(w.getTime())){ streak++; w.setDate(w.getDate()-7); } }
  // weekly volume last 8 weeks
  const weeks=[]; for(let i=7;i>=0;i--){ const w=new Date(ws); w.setDate(w.getDate()-7*i); weeks.push({t:w.getTime(), v:0, n:0}); }
  S.forEach(s=>{ const t=weekStart(s.date).getTime(); const w=weeks.find(x=>x.t===t); if(w){ w.v+=s.volume||volumeOf(s); w.n++; } });
  // PRs
  const pr={}; S.forEach(s=>(s.exercises||[]).forEach(e=>e.sets.forEach(x=>{ const kg=num(x.kg), r=num(x.reps); if(!kg) return; const v=e1rm(kg,r);
    if(!pr[e.name]||v>pr[e.name].v) pr[e.name]={v,kg,r}; })));
  const prList = Object.entries(pr).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  return `<div class="stack">
    <header class="top"><span class="eyebrow">Progreso</span><h1>Tu historial</h1></header>
    <div class="stats">
      <div class="stat"><b>${thisWeek.length}</b><span>sesiones esta semana</span></div>
      <div class="stat"><b>${fmtKg(thisWeek.reduce((a,s)=>a+(s.volume||0),0))}</b><span>volumen semana</span></div>
      <div class="stat"><b>${streak}</b><span>semanas seguidas</span></div>
    </div>
    <section class="panel chart"><div class="spread"><h2>Volumen semanal</h2><span class="eyebrow">kg × reps</span></div>${chart(weeks)}</section>
    ${prList.length?`<section class="panel"><div class="spread" style="margin-bottom:10px"><h2>Récords</h2><span class="eyebrow">1RM estimado</span></div>
      <div class="prs">${prList.map(([n,p])=>`<span class="n">${esc(n)}</span><span class="num muted">${esc(p.kg)}×${esc(p.r)}</span><span class="num"><strong>${Math.round(p.v)}</strong> kg</span>`).join("")}</div></section>`:""}
    <section class="stack"><h2>Sesiones</h2><div class="hist">${S.map(s=>{
      const dt=new Date(s.date);
      return `<article class="sess"><div class="spread"><h3>${esc(s.routine)}</h3>
          <span class="meta">${dt.toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}</span></div>
        <span class="meta">${s.minutes||"?"} min · ${fmtKg(s.volume||volumeOf(s))} · ${(s.exercises||[]).reduce((a,e)=>a+e.sets.length,0)} series</span>
        <div class="lines">${(s.exercises||[]).map(e=>{ const top=e.sets.reduce((b,x)=>num(x.kg)>num(b.kg)?x:b,e.sets[0]); return `${esc(e.name)} <span class="num">${e.sets.length}×${esc(top.reps)}${num(top.kg)?" @ "+esc(top.kg)+" kg":""}</span>`}).join("<br>")}</div>
        ${state.confirm?.del===s.id?`<div class="row"><button class="btn danger ghost" data-act="del-yes" data-id="${esc(s.id)}">Borrar sesión</button><button class="btn" data-act="cancel">Cancelar</button></div>`
          :`<div><button class="btn danger" style="min-height:32px;padding:0;font-size:.8rem;background:none" data-act="del" data-id="${esc(s.id)}">Borrar</button></div>`}
      </article>`}).join("")}</div></section>
    ${note}
  </div>`;
}

function chart(weeks){
  const W=320,H=150,L=8,R=8,T=20,B=24, max=Math.max(1,...weeks.map(w=>w.v));
  const bw=(W-L-R)/weeks.length;
  const bars = weeks.map((w,i)=>{
    const h=(w.v/max)*(H-T-B), x=L+i*bw+bw*0.18, y=H-B-h, last=i===weeks.length-1;
    const d=new Date(w.t);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(h,w.v?2:0).toFixed(1)}" rx="3" fill="var(--accent)" opacity="${last?1:.45}"/>
      ${w.v&&(last||w.v===max)?`<text x="${(x+bw*0.32).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--fg)">${w.v>=1000?(w.v/1000).toFixed(1)+"t":Math.round(w.v)}</text>`:""}
      <text x="${(x+bw*0.32).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--muted)">${d.getDate()}/${d.getMonth()+1}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volumen por semana, últimas 8 semanas"><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>${bars}</svg>`;
}

function renderRest(){
  const el=document.getElementById("rest");
  if(!restT || !state.draft){ el.hidden=true; el.dataset.k=""; return; }
  const left = Math.ceil((restT.end-Date.now())/1000);
  const over = left<=0;
  if(over && !restT.beeped){ restT.beeped=true; beep(); }
  el.hidden=false;
  const key = over?"over":"run";
  if(el.dataset.k===key && el.firstElementChild){
    el.querySelector(".t").textContent = over?"+"+mmss(-left):mmss(left);
    const bar=el.querySelector(".bar i"); if(bar) bar.style.width=Math.max(0,100*left/restT.total)+"%";
    return;
  }
  el.dataset.k=key;
  el.innerHTML = `<div class="card ${over?"over":""}">
    <div style="flex:1;min-width:0"><div class="lbl">${over?"¡A por la siguiente!":"Descanso"}</div>
      <div class="t num">${over?"+"+mmss(-left):mmss(left)}</div>
      ${over?"":`<div class="bar"><i style="width:${Math.max(0,100*left/restT.total)}%"></i></div>`}</div>
    ${over?"":`<button class="btn" data-act="rest-add" data-d="-15">−15</button><button class="btn" data-act="rest-add" data-d="15">+15</button>`}
    <button class="btn" data-act="rest-skip">${over?"Cerrar":"Saltar"}</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("[data-act],[data-tab]"); if(!b) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; state.confirm=null; state.msg=""; render(); scrollTo(0,0); return; }
  const a=b.dataset.act, d=state.draft, ei=+b.dataset.e, si=+b.dataset.s;
  switch(a){
    case "start": startRoutine(+b.dataset.i); break;
    case "empty": startEmpty(); break;
    case "gotrain": state.tab="train"; render(); break;
    case "restpick": state.rest=+b.dataset.s; ls.set(LS_REST,state.rest); render(); break;
    case "tick": { const s=d.exercises[ei].sets[si]; s.done=!s.done; saveDraft(); render(); if(s.done) startRest(); break; }
    case "addset": { const sets=d.exercises[ei].sets, l=sets[sets.length-1]||{kg:"",reps:10}; sets.push({kg:l.kg,reps:l.reps,done:false}); saveDraft(); render(); break; }
    case "rmset": d.exercises[ei].sets.pop(); saveDraft(); render(); break;
    case "rmex": d.exercises.splice(ei,1); saveDraft(); render(); break;
    case "finish": case "discard": state.confirm=a; render(); break;
    case "cancel": state.confirm=null; render(); break;
    case "finish-yes": await finish(); break;
    case "discard-yes": state.draft=null; state.confirm=null; restT=null; saveDraft(); render(); renderRest(); break;
    case "export": exportBackup(); break;
    case "del": state.confirm={del:b.dataset.id}; render(); break;
    case "del-yes": state.confirm=null; await deleteSession(b.dataset.id); render(); break;
    case "rest-add": restT.end+= +b.dataset.d*1000; restT.total=Math.max(restT.total,(restT.end-Date.now())/1000); renderRest(); break;
    case "rest-skip": restT=null; renderRest(); break;
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target; if(!t.dataset.f || !state.draft) return;
  state.draft.exercises[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=t.value; saveDraft();
});
document.addEventListener("submit", ev=>{
  if(ev.target.id!=="addex") return; ev.preventDefault();
  const name=document.getElementById("newex").value.trim(); if(!name) return;
  const prev=lastSets(name);
  state.draft.exercises.push({name, sets:(prev.length?prev:[{kg:"",reps:10},{kg:"",reps:10},{kg:"",reps:10}]).map(x=>({kg:x.kg,reps:x.reps,done:false}))});
  saveDraft(); render();
});
document.addEventListener("change", ev=>{ if(ev.target.id==="importfile" && ev.target.files[0]) importBackup(ev.target.files[0]); });
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.draft) keepAwake(); });
setInterval(()=>{
  if(state.draft){ const c=document.getElementById("clock"); if(c) c.textContent=mmss((Date.now()-state.draft.started)/1000); }
  if(restT) renderRest();
},250);

render(); renderRest(); initStore();
})();
</script>
